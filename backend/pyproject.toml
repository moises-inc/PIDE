[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pide-backend"
version = "0.1.0"
description = "Deterministic offline backend for the Periodic Information and Data Explorer"
authors = [{ name = "Moisés Amundarain Romero" }]
license = { text = "MIT" }
keywords = ["chemistry", "periodic-table", "scientific-computing", "offline"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "periodictable>=1.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
surface = ["scikit-image>=0.22,<1"]

[project.urls]
"NIDE inspiration" = "https://github.com/AndresSabogal00/NIDE"
"IUPAC periodic table" = "https://iupac.org/what-we-do/periodic-table-of-elements/"
"CIAAW atomic weights" = "https://ciaaw.org/atomic-weights.htm"
"NIST Atomic Spectra Database" = "https://www.nist.gov/pml/atomic-spectra-database"
"CRC Handbook" = "https://hbcp.chemnetbase.com/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pide*"]
